# AVX2 and BMI2 are compiled in for amd64 (every AVX-512 Xeon has them); `tok-mask` and the ID
# packer pick their fast paths from these at compile time. cascadelake is the untested step up.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v3"]
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
