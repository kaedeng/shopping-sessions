[workspace]
members = ["crates/*"]
exclude = ["prototypes", "generator"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[package]
name = "shopping-sessions"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
types = { path = "crates/types", default-features = false }
ingest = { path = "crates/ingest", default-features = false }
links = { path = "crates/links", default-features = false }
dedup = { path = "crates/dedup", default-features = false }
sessions = { path = "crates/sessions", default-features = false }
output = { path = "crates/output", default-features = false }
mimalloc = { version = "0.1", optional = true }

# One feature per alternative in alternatives.md. Features only add code: the picks are the
# defaults, and when a slot has several compiled in, its env var chooses (implementation.md).
[features]
default = [
    "id-u64", "rec-32", "hash-mul", "table-linear", "par-counter",
    "reader-mmap", "tok-mask", "tok-shape", "ts-table",
    "links-serial", "lookup-prefetch",
    "dedup-partitioned",
    "sess-partitioned", "sess-purchase-side", "sort-grouped", "sort-std", "attr-sweep", "agg-dense",
    "out-arrow", "out-direct",
    "fast-exit", "alloc-parallel", "free-early", "scatter-wc",
    "pipe-positional", "alloc-region",
]
# types
id-u64 = ["types/id-u64"]
rec-32 = ["types/rec-32"]
hash-mul = ["types/hash-mul"]
table-linear = ["types/table-linear"]
par-counter = ["types/par-counter"]
# Write-combining buffers with streaming stores in both scatters (`SS_SCATTER=combine|plain`).
scatter-wc = ["types/scatter-wc"]
# ingest
reader-mmap = ["ingest/reader-mmap"]
reader-populate = ["ingest/reader-populate"]
tok-mask = ["ingest/tok-mask"]
tok-scalar = ["ingest/tok-scalar"]
tok-shape = ["ingest/tok-shape"]
ts-table = ["ingest/ts-table"]
# links
links-serial = ["links/links-serial"]
lookup-prefetch = ["links/lookup-prefetch"]
# dedup
dedup-partitioned = ["dedup/dedup-partitioned"]
# sessions
sess-partitioned = ["sessions/sess-partitioned"]
sess-purchase-side = ["sessions/sess-purchase-side"]
sort-std = ["sessions/sort-std"]
sort-grouped = ["sessions/sort-grouped"]
sort-radix = ["sessions/sort-radix"]
attr-sweep = ["sessions/attr-sweep"]
agg-dense = ["sessions/agg-dense"]
# output
out-arrow = ["output/out-arrow"]
# `user_daily` written by hand, `SS_OUT=direct|arrow` (the pick first); needs `out-arrow` for
# `campaign_daily` and as the alternative.
out-direct = ["output/out-direct"]
# process
# The pipeline for data that carries the generator's numbering, with the classic one as the
# fallback (`SS_PIPE=auto|classic|positional`).
pipe-positional = ["types/pipe-positional", "ingest/pipe-positional", "sessions/pipe-positional"]
fast-exit = []
# Each stage's per-worker buffers built on the workers' own threads (`SS_ALLOC=serial|parallel`).
alloc-parallel = []
# Input pages and dead buffers are handed back by the workers, not at exit (`SS_FREE=early|exit`).
free-early = ["types/free-early"]
# Not a slot: `SS_TRACE=FILE` writes every task as a span, for ui.perfetto.dev (implementation.md).
trace = ["types/trace"]
# A process has one global allocator, so this one swaps at build time; no env var.
alloc-mimalloc = ["dep:mimalloc"]
# The process's allocator is `src/region.rs`: one reservation, blocks by moving a mark. Build
# without it (and without `alloc-mimalloc`) for the system allocator.
alloc-region = []

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# The release build plus symbols and line tables, so samply and perf can name inlined frames.
# `make profiling` builds it with the `trace` feature into target/profiling/shopping-sessions.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
split-debuginfo = "packed"
