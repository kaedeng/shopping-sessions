[package]
name = "output"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
types = { path = "../types" }
parquet = { version = "60.1.0", default-features = false, features = ["arrow"], optional = true }
arrow-array = { version = "60.1.0", optional = true }
arrow-buffer = { version = "60.1.0", optional = true }
arrow-schema = { version = "60.1.0", optional = true }

[features]
default = ["out-arrow"]
out-arrow = ["dep:parquet", "dep:arrow-array", "dep:arrow-buffer", "dep:arrow-schema"]
